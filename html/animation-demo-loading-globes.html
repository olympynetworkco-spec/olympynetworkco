<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Options</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --color-accent: #ff7a18;
}

    html, body {
      background: #d5ccc5 url('file:///Users/olympynetworkco/Desktop/themes/native-tools.png') center center / 95% 95% no-repeat fixed;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: 'Chakra Petch', system-ui, sans-serif;
    }

    #stage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage canvas {
      display: block;
      width: 380px;
      height: 380px;
    }

    .nav {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(79, 216, 255, 0.35);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      color: #4fd8ff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s ease;
      user-select: none;
    }
    .btn:hover {
      color: #fff;
      border-color: rgba(79, 216, 255, 0.7);
      box-shadow: 0 0 20px rgba(79, 216, 255, 0.4);
    }
    .btn:active { transform: scale(0.94); }

    .name {
      color: #eaf2ff;
      font-size: 13px;
      letter-spacing: 0.08em;
      min-width: 220px;
      text-align: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(10, 14, 28, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(79, 216, 255, 0.25);
    }
    .name .idx { color: #4fd8ff; font-weight: 700; }



  </style>
</head>
<body>

<div id="stage"></div>

<div class="nav">

<div id="color-picker">
  <input type="color" id="accentPicker" value="#ff7a18" />
</div>


  <button class="btn" id="prevBtn">‹</button>
  <div class="name"><span id="animName">3D Sphere Scan</span> · <span class="idx"><span id="animIndex">1</span>/10</span></div>
  <button class="btn" id="nextBtn">›</button>
</div>

<script>
(function(){
  const SIZE = 380;
  const W = SIZE, H = SIZE;
  const cx = W / 2, cy = H / 2;

  const PRIMARY = [255, 255, 255];
  const ACCENT  = [255, 122, 24];

  const easeInOutSine  = t => -(Math.cos(Math.PI * t) - 1) / 2;
  const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const smoothstep = (e0, e1, x) => {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  };
  const mix = (a, b, t, alpha) => {
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return `rgba(${r}, ${g}, ${bl}, ${alpha})`;
  };

  // ─── stage ───
  const stage = document.getElementById('stage');
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  stage.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  // ─── animation catalog ───
  const animations = [];

  // 0 — 3D Sphere Scan
  animations.push({
    name: '3D Sphere Scan',
    init: () => {
      const radius = W * 0.4;
      const numDots = 500;
      const dots = [];
      for (let i = 0; i < numDots; i++) {
        const theta = Math.acos(1 - 2 * (i / numDots));
        const phi = Math.sqrt(numDots * Math.PI) * theta;
        dots.push({
          x: radius * Math.sin(theta) * Math.cos(phi),
          y: radius * Math.sin(theta) * Math.sin(phi),
          z: radius * Math.cos(theta)
        });
      }
      return { radius, dots, numDots };
    },
    draw: (t, state) => {
      const { radius, dots } = state;
      const rotX = Math.sin(t * 0.3) * 0.5;
      const rotY = t * 0.5;
      const eased = easeInOutCubic((Math.sin(t * 2.5) + 1) / 2);
      const scanLine = (eased * 2 - 1) * radius;
      const scanWidth = 50;

      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        let { x, y, z } = d;

        const nX = x * Math.cos(rotY) - z * Math.sin(rotY);
        let nZ   = x * Math.sin(rotY) + z * Math.cos(rotY);
        x = nX; z = nZ;

        const nY = y * Math.cos(rotX) - z * Math.sin(rotX);
        nZ       = y * Math.sin(rotX) + z * Math.cos(rotX);
        y = nY; z = nZ;

        const scale = (z + radius * 1.5) / (radius * 2.5);
        const pX = cx + x;
        const pY = cy + y;

        const distToScan = Math.abs(y - scanLine);
        const scanInf = distToScan < scanWidth
          ? Math.cos((distToScan / scanWidth) * (Math.PI / 2))
          : 0;

        const size = Math.max(0, scale * 3.0 + scanInf * 4.0);
        const opacity = Math.max(0, scale * 0.6 + scanInf * 0.4);
        if (size < 0.2) continue;

        ctx.beginPath();
        ctx.arc(pX, pY, size, 0, Math.PI * 2);
        if (scanInf > 0.3) {
          ctx.fillStyle = `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${opacity})`;
        } else {
          ctx.fillStyle = `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${opacity})`;
        }
        ctx.fill();
      }
    }
  });

  // ─── pulse-wave family — shared ring setup ───
  const rings = [
    { radius: 30, count: 8 },
    { radius: 60, count: 16 },
    { radius: 90, count: 24 },
    { radius: 120, count: 32 },
    { radius: 150, count: 40 }
  ];

  function ringLoop(fn) {
    return (t) => {
      // central dot
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},0.9)`;
      ctx.fill();
      for (let r = 0; r < rings.length; r++) fn(rings[r], r, t);
    };
  }

  // 1 — Pulse Wave
  animations.push({
    name: 'Pulse Wave',
    draw: ringLoop((ring, ri, t) => {
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        const pt = t * 2 - ri * 0.4;
        const rp = easeInOutSine((Math.sin(pt) + 1) / 2) * 8 - 4;
        const x = cx + Math.cos(a) * (ring.radius + rp);
        const y = cy + Math.sin(a) * (ring.radius + rp);
        const op = 0.3 + easeInOutSine((Math.sin(pt + i * 0.2) + 1) / 2) * 0.7;
        const hl = easeInOutCubic((Math.sin(pt) + 1) / 2);
        const blend = smoothstep(0.2, 0.8, hl);
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = mix(PRIMARY, ACCENT, blend, op);
        ctx.fill();
      }
    })
  });

  // 2 — Scanning Wave
  animations.push({
    name: 'Scanning Wave',
    draw: ringLoop((ring, ri, t) => {
      const scanHeight = 180;
      const scanPhase = (Math.sin(t * 1.5) + 1) / 2;
      const scanY = cy + (easeInOutSine(scanPhase) * 2 - 1) * (cy + scanHeight / 2);
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        const x = cx + Math.cos(a) * ring.radius;
        const y = cy + Math.sin(a) * ring.radius;
        const dist = Math.abs(y - scanY);
        let op = 0;
        if (dist < scanHeight / 2) op = easeInOutCubic(1 - dist / (scanHeight / 2));
        if (op > 0.01) {
          const size = 1.5 + easeInOutSine(op) * 2.5;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = mix(PRIMARY, ACCENT, smoothstep(0.2, 0.8, op), op);
          ctx.fill();
        }
      }
    })
  });

  // 3 — Interconnecting Wave
  animations.push({
    name: 'Interconnecting Wave',
    draw: ringLoop((ring, ri, t) => {
      if (ri >= rings.length - 1) return;
      const next = rings[ri + 1];
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        const rp1 = Math.sin(t * 2 - ri * 0.4) * 5;
        const x1 = cx + Math.cos(a) * (ring.radius + rp1);
        const y1 = cy + Math.sin(a) * (ring.radius + rp1);
        const ratio = next.count / ring.count;
        for (let j = 0; j < ratio; j++) {
          const na = ((i * ratio + j) / next.count) * Math.PI * 2;
          const rp2 = Math.sin(t * 2 - (ri + 1) * 0.4) * 5;
          const x2 = cx + Math.cos(na) * (next.radius + rp2);
          const y2 = cy + Math.sin(na) * (next.radius + rp2);
          const lineOp = 0.1 + ((Math.sin(t * 3 - ri * 0.5 + i * 0.3) + 1) / 2) * 0.5;
          const active = Math.sin(t * 3 - ri * 0.5 + i * 0.3) > 0.6;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineWidth = 1;
          ctx.strokeStyle = active
            ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${lineOp})`
            : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${lineOp})`;
          ctx.stroke();
        }
        const dotOp = 0.4 + Math.sin(t * 2 - ri * 0.4 + i * 0.2) * 0.6;
        const hl = Math.sin(t * 2 - ri * 0.4 + i * 0.2) > 0.7;
        ctx.beginPath();
        ctx.arc(x1, y1, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = hl
          ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${dotOp})`
          : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${dotOp})`;
        ctx.fill();
      }
    })
  });

  // 4 — Size Pulse Wave
  animations.push({
    name: 'Size Pulse Wave',
    draw: ringLoop((ring, ri, t) => {
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        const x = cx + Math.cos(a) * ring.radius;
        const y = cy + Math.sin(a) * ring.radius;
        const pt = t * 2 - ri * 0.4;
        const sizePulse = 1 + easeInOutCubic((Math.sin(pt) + 1) / 2) * 5;
        const op = 0.2 + easeInOutSine((Math.sin(pt + i * 0.2) + 1) / 2) * 0.8;
        const intensity = smoothstep(1.5, 5.5, sizePulse);
        ctx.beginPath();
        ctx.arc(x, y, sizePulse, 0, Math.PI * 2);
        ctx.fillStyle = mix(PRIMARY, ACCENT, smoothstep(0.2, 0.8, intensity), op);
        ctx.fill();
      }
    })
  });

  // 5 — Spiral Pulse Wave
  animations.push({
    name: 'Spiral Pulse Wave',
    draw: ringLoop((ring, ri, t) => {
      const rot = 0.5 - ri * 0.08;
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2 + t * rot;
        const rp = Math.sin(t * 2 - ri * 0.4) * 5;
        const x = cx + Math.cos(a) * (ring.radius + rp);
        const y = cy + Math.sin(a) * (ring.radius + rp);
        const op = 0.4 + Math.sin(t * 2 - ri * 0.4) * 0.6;
        const lead = (a % (Math.PI * 2)) < Math.PI / 4;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = lead
          ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${op})`
          : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${op})`;
        ctx.fill();
      }
    })
  });

  // 6 — Clockwork Wipe
  animations.push({
    name: 'Clockwork Wipe',
    draw: ringLoop((ring, ri, t) => {
      const fadeLength = Math.PI / 1.5;
      const wipeAngle = (t * 1.5 + ri * 0.5) % (Math.PI * 2);
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        let diff = (a - wipeAngle) % (Math.PI * 2);
        if (diff < 0) diff += Math.PI * 2;
        let op = 0;
        if (diff < fadeLength) op = Math.pow(1 - diff / fadeLength, 2);
        if (op > 0.01) {
          const size = 2 + op * 3;
          const rOff = op * 8;
          const x = cx + Math.cos(a) * (ring.radius + rOff);
          const y = cy + Math.sin(a) * (ring.radius + rOff);
          const front = diff < fadeLength / 3;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = front
            ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${op * 0.9})`
            : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${op * 0.9})`;
          ctx.fill();
        }
      }
    })
  });

  // 7 — Line Pulse Wave
  animations.push({
    name: 'Line Pulse Wave',
    draw: ringLoop((ring, ri, t) => {
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        const rp = Math.sin(t * 2 - ri * 0.4) * 5;
        const x = cx + Math.cos(a) * (ring.radius + rp);
        const y = cy + Math.sin(a) * (ring.radius + rp);
        const op = 0.4 + Math.sin(t * 2 - ri * 0.4 + i * 0.2) * 0.6;
        const active = Math.sin(t * 2 - ri * 0.4 + i * 0.2) > 0.6;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.lineWidth = 0.7;
        ctx.strokeStyle = active
          ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${op * 0.7})`
          : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${op * 0.5})`;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = active
          ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${op})`
          : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${op})`;
        ctx.fill();
      }
    })
  });

  // 8 — Sharp Pulse Wave
  animations.push({
    name: 'Sharp Pulse Wave',
    draw: ringLoop((ring, ri, t) => {
      for (let i = 0; i < ring.count; i++) {
        const a = (i / ring.count) * Math.PI * 2;
        const phase = t * 2 - ri * 0.4;
        const sharp = Math.pow(Math.sin(phase), 4);
        const rp = sharp * 10 - 4;
        const x = cx + Math.cos(a) * (ring.radius + rp);
        const y = cy + Math.sin(a) * (ring.radius + rp);
        const op = 0.2 + Math.pow(Math.sin(phase + i * 0.2), 4) * 0.8;
        const peak = sharp > 0.8;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = peak
          ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${op})`
          : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${op})`;
        ctx.fill();
      }
    })
  });

  // 9 — Fragmenting Pulse Wave
  animations.push({
    name: 'Fragmenting Pulse Wave',
    draw: ringLoop((ring, ri, t) => {
      const phase = (t * 0.4 - ri * 0.08) % 1;
      const currentRadius = ring.radius + phase * 40;
      if (currentRadius > ring.radius + 1) {
        const op = 1 - Math.pow(phase, 2);
        const dotSize = 4 * (1 - phase);
        const expanding = phase < 0.3;
        for (let i = 0; i < ring.count; i++) {
          const a = (i / ring.count) * Math.PI * 2;
          const x = cx + Math.cos(a) * currentRadius;
          const y = cy + Math.sin(a) * currentRadius;
          ctx.beginPath();
          ctx.arc(x, y, dotSize, 0, Math.PI * 2);
          ctx.fillStyle = expanding
            ? `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${op})`
            : `rgba(${PRIMARY[0]},${PRIMARY[1]},${PRIMARY[2]},${op})`;
          ctx.fill();
        }
      }
    })
  });

  // ─── runtime ───
  let current = 0;
  let currentState = null;
  let time = 0;
  let lastTs = 0;

  function setAnim(index) {
    current = (index + animations.length) % animations.length;
    const a = animations[current];
    currentState = a.init ? a.init() : null;
    time = 0;
    lastTs = 0;
    document.getElementById('animName').textContent = a.name;
    document.getElementById('animIndex').textContent = current + 1;
  }

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;
    time += dt * 0.001;

    ctx.clearRect(0, 0, W, H);
    animations[current].draw(time, currentState);

    requestAnimationFrame(frame);
  }

document.getElementById('prevBtn').addEventListener('click', () => setAnim(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => setAnim(current + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') setAnim(current + 1);
  if (e.key === 'ArrowLeft')  setAnim(current - 1);
});

// ─── color picker → updates ACCENT ───
const picker = document.getElementById('accentPicker');
function hexToRgbArr(hex) {
  const h = hex.replace('#', '');
  return [
    parseInt(h.substring(0, 2), 16),
    parseInt(h.substring(2, 4), 16),
    parseInt(h.substring(4, 6), 16)
  ];
}
function applyAccent(hex) {
  const rgb = hexToRgbArr(hex);
  ACCENT[0] = rgb[0];
  ACCENT[1] = rgb[1];
  ACCENT[2] = rgb[2];
  document.documentElement.style.setProperty('--color-accent', hex);
}
if (picker) {
  picker.addEventListener('input', (e) => applyAccent(e.target.value));
}

setAnim(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
