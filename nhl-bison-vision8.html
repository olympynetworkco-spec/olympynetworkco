<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHL Rink · 3D</title>


<link rel="icon" href="/themes/nhl/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/themes/nhl/favicon.ico" type="image/x-icon">




<style>


:root{--bg:#02050a;--panel:rgba(6,12,22,.9);--border:rgba(59,130,246,.3);--text:#dbeafe;--dim:#6b8bb5;--acc:#3b82f6;--acc2:#60a5fa;--goal:#facc15;--pen:#f87171;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px var(--font);overflow:hidden}
body>canvas{position:fixed!important;inset:0;z-index:0;touch-action:none}
#hdr{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,rgba(2,5,10,.96),rgba(2,5,10,.75));backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
#brand{font-weight:800;letter-spacing:2px;font-size:17px;color:var(--acc2);padding-right:10px;border-right:1px solid var(--border)}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tab{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap;border:0;background:none}
.tab.on{color:var(--text);background:rgba(59,130,246,.2);box-shadow:inset 0 0 0 1px var(--border)}
#strip{position:fixed;left:0;right:0;z-index:20;top:calc(54px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px 12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:12px;cursor:pointer}
.chip.on{border-color:var(--acc2);box-shadow:0 0 10px rgba(59,130,246,.4)}
.chip b{color:var(--acc2)}
.chip i{color:var(--dim);font-style:normal;font-size:10px;margin-left:6px}
.pane{position:fixed;z-index:15;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:none;max-height:55%;overflow:auto}
.pane.on{display:block}
#ctl{display:flex;align-items:center;gap:8px}
#ctl button{width:38px;height:34px;border-radius:8px;border:1px solid var(--border);background:rgba(59,130,246,.12);color:var(--text);font-size:15px}
#ctl input{flex:1;accent-color:var(--acc)}
#info{margin-top:8px;color:var(--dim);font-size:12px;min-height:16px}
#info b{color:var(--text)}
#wp{margin-top:8px;display:none;height:18px;border-radius:9px;overflow:hidden;background:#0b1d3a;font-size:10px;line-height:18px;color:#fff;border:1px solid var(--border)}
#wp div{height:100%;padding:0 8px;float:left;white-space:nowrap}
#xfBox .pl{margin-bottom:12px}
#xfBox .nm{font-size:14px;font-weight:700;color:var(--goal)}
#xfBox .nm i{font-style:normal;color:var(--dim);font-weight:500;font-size:11px;margin-left:6px}
#xfBox .gl{padding:7px 8px;margin-top:4px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text)}
#xfBox .gl:active{background:rgba(59,130,246,.2)}
#xfBox .gl small{display:block;color:var(--dim);margin-top:2px}
.hubb{padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--goal);border:1px solid rgba(250,204,21,.4);background:rgba(250,204,21,.08);cursor:pointer;white-space:nowrap}
.hubb.on{background:rgba(250,204,21,.2)}
#nav .hubb{flex:none}
#plBtn{margin-left:auto}
@media(max-width:700px){.tab .ic{display:none}.tab{padding:6px 6px!important;font-size:11.5px}#hdr{gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top,0px))}#brand{font-size:14px;letter-spacing:1px;padding-right:7px}#nav{gap:2px}.tab{padding:6px 9px;font-size:12px}.hubb{padding:6px 9px;font-size:14px}.hubb .lbl{display:none}}
/* ═════ MOMENTUM ALERTS ═════ */
#toastBox {
  position: fixed;
  top: calc(110px + env(safe-area-inset-top, 0px));
  right: 12px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.momentum-alert {
  background: var(--panel);
  border: 2px solid var(--acc2);
  border-radius: 10px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.8), 0 0 15px rgba(59,130,246,0.3);
  padding: 10px;
  width: 280px;
  pointer-events: auto;
  animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.momentum-alert.out { animation: slideOutRight 0.3s ease-in forwards; }
@keyframes slideInRight {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOutRight {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(120%); opacity: 0; }
}
.momentum-alert .ma-hd {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  justify-content: space-between;
}
.momentum-alert .ma-hd span { color: var(--acc2); }
.momentum-alert canvas {
  width: 100%;
  height: 60px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: #02050a;
}
/* scoreboard widget (TV-style): period/clock | logo+abbr | score | win % */
#sb{position:fixed;z-index:18;left:12px;top:calc(100px + env(safe-area-inset-top,0px));display:none;background:rgba(6,12,22,.94);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.55);font-weight:800;user-select:none}
#sb .gr{display:grid;grid-template-columns:64px minmax(86px,auto) 40px 52px;align-items:stretch}
#sb .tm{grid-row:1/3;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:4px 8px;background:#111827;color:#fff;font-size:15px;line-height:1.1;text-align:center;border-right:1px solid var(--border)}
#sb .tm small{font-size:14px;color:#fff;font-weight:800}
#sb .t{display:flex;align-items:center;gap:6px;padding:5px 10px;color:#fff;font-size:15px;letter-spacing:.5px}
#sb .t.a{background:#1d4ed8}#sb .t.h{background:#0e7490}
#sb .t .lg{height:22px;width:22px;object-fit:contain}
#sb .s{display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0b1220;font-size:24px;border-top:1px solid #cbd5e1;transition:background .3s}
#sb .s.r1{border-top:0}
#sb .s.bump{background:var(--goal)}
#sb .w{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1424;color:var(--dim);font-size:15px;line-height:1.05;border-top:1px solid rgba(59,130,246,.25)}
#sb .w.r1{border-top:0}#sb .w.lead{color:var(--goal)}
#sb .w small{font-size:8px;letter-spacing:1px;font-weight:700;color:var(--dim)}
#sb .bar{grid-column:1/-1;display:flex;height:4px}#sb .bar i{display:block;height:100%}
#hub{position:fixed;z-index:40;top:calc(54px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(360px,100%);background:var(--panel);backdrop-filter:blur(16px);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
#hub.on{transform:none}
#hub .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:800;letter-spacing:1.5px;color:var(--goal)}
#hub .hd button{background:none;border:0;color:var(--dim);font-size:18px}
#hubBody{overflow:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));flex:1;-webkit-overflow-scrolling:touch}
.card{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:rgba(15,30,60,.35)}
.card h4{margin:0 0 8px;font-size:10px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;font-weight:700}
.sr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;padding:3px 0;font-size:12px}
.sr b{color:var(--text)} .sr span{color:var(--dim);font-size:11px}
.sr.top{font-weight:800;color:var(--acc2);margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(59,130,246,.15);font-size:12px}
.row:first-of-type{border-top:0} .row em{font-style:normal;color:var(--dim);font-size:11px;white-space:nowrap}
.pf{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pf button{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:none;color:var(--dim);font-size:11px;font-weight:700}
.pf button.on{color:var(--text);background:rgba(59,130,246,.25);border-color:var(--acc2)}
.pb{display:grid;grid-template-columns:54px 24px 1fr;gap:6px;align-items:start;padding:6px 4px;border-top:1px solid rgba(59,130,246,.15);font-size:12px;cursor:pointer}
.pb:first-of-type{border-top:0}
.pb em{font-style:normal;color:var(--dim);font-size:11px;padding-top:1px}
.pb span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#475569}
.pb.g span:before{background:var(--goal)} .pb.s span:before{background:var(--acc2)} .pb.p span:before{background:var(--pen)}
.pb.g span{color:var(--goal);font-weight:700} .pb.p span{color:var(--pen)}
.pb b{display:flex;justify-content:center;padding-top:0}.pb b .lg{width:22px;height:22px;margin:0}
.pb.cur{background:rgba(59,130,246,.22);border-radius:6px}
@media(max-width:700px){#hub{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--border);border-radius:14px 14px 0 0;transform:translateY(105%)}}
.od{display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;align-items:center;font-size:13px}
.od .h{color:var(--acc2);font-weight:800;text-align:center;letter-spacing:1px}
.od .l{color:var(--dim);font-size:11px}
.od .v{text-align:center;padding:8px 6px;border:1px solid var(--border);border-radius:8px;background:rgba(15,30,60,.4)}
.od .v b{display:block;font-size:15px}.od .v small{color:var(--dim);font-size:10px}
.od .fav{border-color:var(--acc2);box-shadow:0 0 8px rgba(59,130,246,.35)}
.od .win{border-color:#4ade80;background:rgba(74,222,128,.16);box-shadow:0 0 10px rgba(74,222,128,.4)}
.od .win b{color:#4ade80}
.od .lose{opacity:.45}
.od-res{margin-top:8px;font-size:11px;color:#4ade80;font-weight:700}
.wpb{display:block;height:20px;border-radius:10px;overflow:hidden;background:#0b1d3a;font-size:11px;line-height:20px;color:#fff;border:1px solid var(--border);margin:4px 0 12px}
.wpb div{height:100%;padding:0 8px;float:left;white-space:nowrap}
.src{color:var(--dim);font-size:10px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--acc2);font-weight:600}
.xs{overflow-x:auto}
#histBox table{width:100%;border-collapse:collapse;font-size:12px;min-width:340px}
#histBox th{color:var(--dim);font-weight:600;text-align:right;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
#histBox td{padding:6px;text-align:right;border-bottom:1px solid rgba(30,58,138,.35);white-space:nowrap}
#histBox th:first-child,#histBox td:first-child{text-align:left}
#histBox tr.hl td{background:rgba(59,130,246,.16)}
#histBox tr.trow{cursor:pointer}#histBox tr.trow:active,#histBox tr.sel td{background:rgba(59,130,246,.28)}
#histBox tr.tcard>td{padding:0;text-align:left;white-space:normal}
.tcw{padding:8px 10px;background:rgba(15,30,60,.55);border-left:2px solid var(--acc2)}
.tch{font-weight:800;color:var(--acc2);margin-bottom:4px}.tch i{font-style:normal;color:var(--dim);font-weight:500;font-size:11px;margin-left:8px}
.tsub{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:8px 0 2px}
.tg{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:4px 0;border-top:1px solid rgba(59,130,246,.15);font-size:12px}
.tg:first-of-type{border-top:0}.tg em{font-style:normal;color:var(--dim);font-size:11px}.tg i{font-style:normal;font-weight:700;font-size:10px;margin-right:4px}.tg small{color:var(--dim);font-size:10px}.tg b{font-size:11px}
#histBox .w{color:#4ade80}#histBox .l{color:#f87171}#histBox .o{color:#fbbf24}
.hctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.lg{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin:0 4px}
#vidBox video{width:100%;height:auto;max-height:none;object-fit:contain;background:#000;border-radius:8px;display:block}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.vchip{padding:5px 9px;border:1px solid var(--border);border-radius:8px;font-size:11px;cursor:pointer;background:rgba(15,30,60,.35)}
.vchip.on{border-color:var(--acc2);box-shadow:0 0 8px rgba(59,130,246,.4)}
.vnote{color:var(--dim);font-size:11px;margin-top:6px}
svg text{fill:var(--dim);font:10px var(--font)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-bottom:6px}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
#messyText {
  width: 100%;
  height: 140px;
  margin-top: 10px;
  background: #0b1424;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px;
  overflow-y: auto;
  box-sizing: border-box;
}
/* standings widget */
#standBox table{width:100%;border-collapse:collapse;font-size:12px;min-width:340px}
#standBox th{color:var(--dim);font-weight:600;text-align:right;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
#standBox td{padding:6px;text-align:right;border-bottom:1px solid rgba(30,58,138,.35);white-space:nowrap}
#standBox th:nth-child(1),#standBox td:nth-child(1){text-align:center;width:24px;color:var(--dim)}
#standBox th:nth-child(2),#standBox td:nth-child(2){text-align:left}
#standBox td.pt{font-weight:800;color:var(--acc2)}
#standBox tr.sg th{text-align:left;color:var(--goal);letter-spacing:1.4px;font-size:10px;text-transform:uppercase;padding:10px 6px 4px;border-bottom:1px solid var(--border)}
#standBox tr.hl td{background:rgba(59,130,246,.16)}
/* cards widget (tap to flip) */
#cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;perspective:900px}
.fc{cursor:pointer;display:grid;-webkit-tap-highlight-color:transparent}
.fc .fi{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.fc.flip .fi{transform:rotateY(180deg)}
.fc .ff,.fc .fb{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden}
.fc .ff img{width:100%;height:auto;display:block}
.fc .fb{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;background:linear-gradient(160deg,#0b1424,#050a14);border:2px solid var(--cc,var(--border));box-shadow:0 0 14px var(--cc,transparent) inset}
.fc .fb b{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cc,var(--acc2))}
.fc .fb span{font-size:11px;color:var(--dim)}
.fc .fb img.big{width:62%;max-width:110px;height:auto;filter:drop-shadow(0 0 8px rgba(0,0,0,.6))}
.fc .fb .tn{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--text);text-transform:none}
</style>
</head>
<body>
<div id="hdr"><div id="brand"><img src="/themes/nhl/nhl.png" alt="NHL" style="height:22px;width:auto;vertical-align:middle" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'"><span>NHL</span></div>



<div id="nav">

<button class="tab on" data-t="rink" id="rinkTab">


    <span class="ic" style="display:inline-flex; align-items:center; justify-content:center; margin-right:4px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">
        <rect x="2" y="6" width="20" height="12" rx="4" ry="4"></rect>

        <circle cx="6" cy="12" r="1.5"></circle>
        <circle cx="18" cy="12" r="1.5"></circle>
      </svg>
    </span>Rink
  </button>
  
  <button class="tab" data-t="graph">
    <span class="ic" style="display:inline-flex; align-items:center; justify-content:center; margin-right:4px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">
        <path d="M3 3v18h18"></path>
        <path d="M3 12h8l3-9 4 18 3-9"></path>
      </svg>

  </button>


<button class="tab" data-t="xf">
  <span class="ic" style="display:inline-flex; align-items:center; justify-content:center; margin-right:4px;">


    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(239,68,68,0.6)); vertical-align: text-bottom;">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>

</button>


<button class="tab" data-t="odds">
  <span class="ic" style="display:inline-flex; align-items:center; justify-content:center; margin-right:4px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">

<button class="tab" data-t="vid">

      <polygon points="10 9 15 12 10 15 10 9"></polygon>

</button>

<button class="tab" data-t="hist">
  <span class="ic" style="display:inline-flex; align-items:center; justify-content:center; margin-right:4px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>

<button class="tab" data-t="stand">
  <span class="ic" style="display:inline-flex; align-items:center; justify-content:center; margin-right:4px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">
      <line x1="8" y1="6" x2="21" y2="6"></line>

<button class="tab" data-t="cards">

    </svg>
  </span>Cards

{const seg=[];postPts.forEach(v=>{seg.push(new THREE.Vector3(v.x,0,v.z),new THREE.Vector3(v.x,WALL_H,v.z))});
 const pg=new THREE.BufferGeometry().setFromPoints(seg); rink.add(new THREE.LineSegments(pg,mat(0xbfdbfe,.35)))}

const seatGeo = new THREE.BoxGeometry(1.6, 0.4, 1.6);
const backGeo = new THREE.BoxGeometry(1.6, 1.6, 0.4);

// pre-count chairs so we can allocate instanced buffers
const rings = 16;
let totalChairs = 0;
for (let r = 0; r < rings; r++) {

const dummy = new THREE.Object3D();
let ci = 0;

for (let r = 0; r < rings; r++) {

    const angle = (c / num) * Math.PI * 2;
    const px = Math.cos(angle) * radius;
    const pz = Math.sin(angle) * radius;

    dummy.position.set(px, y, pz);
    dummy.rotation.set(0, -angle + Math.PI/2, 0);
    dummy.updateMatrix();
    seatInst.setMatrixAt(ci, dummy.matrix);

    dummy.position.set(px, y + 0.8, pz);

    backInst.setMatrixAt(ci, dummy.matrix);

// circles + dots
line(arc(0,0,15,0,Math.PI*2,64),RED,.9,true);

/* ═════ HOLOGRAPHIC PLAYER TAG ═════ */
const tagCanvas = document.createElement('canvas');
tagCanvas.width = 512; tagCanvas.height = 128;
const tagCtx = tagCanvas.getContext('2d');
const tagTex = new THREE.CanvasTexture(tagCanvas);
const tagMat = new THREE.SpriteMaterial({ map: tagTex, transparent: true, depthTest: false });
const tagSprite = new THREE.Sprite(tagMat);
tagSprite.scale.set(16, 4, 1); // Size of the tag on the ice
tagSprite.visible = false;
scene.add(tagSprite);

function updatePlayerTag(name) {
  if (!name) { tagSprite.visible = false; return; }
  
  // Clean up the name (remove things like "Wrist Shot")

let cleanName = name.replace(/^\s*(giveaway|takeaway) by\s+/i,'').replace(/(Wrist|Snap|Slap|Backhand|Tip-in|Deflect|Wrap|Shot|Goal|hit|blocked|saved|faceoff).*/gi, '').trim();

if (cleanName.match(/summary|period|end of|start of/i)) cleanName = ""; // Ignore headers

// If the text is just a team name, grab the player from the score description instead
if (cleanName.includes("Avalanche") || cleanName.includes("Penguins") || cleanName.includes("Maple Leafs")) {
    cleanName = name.replace(/.*Goal\s*\(?\d*\)?\s*/i, '').split(',')[0].trim();
}

  if (!cleanName) { tagSprite.visible = false; return; }

  // Draw the hologram tag on a canvas
  tagCtx.clearRect(0, 0, 512, 128);
  tagCtx.fillStyle = 'rgba(6, 12, 22, 0.85)';
  tagCtx.fillRect(0, 0, 512, 128);
  tagCtx.strokeStyle = '#60a5fa';
  tagCtx.lineWidth = 6;
  tagCtx.strokeRect(3, 3, 506, 122);
  
  const label = cleanName.toUpperCase();
  let fs = 48; const fnt = px => 'bold ' + px + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  tagCtx.font = fnt(fs);
  while (tagCtx.measureText(label).width > 470 && fs > 20) { fs -= 2; tagCtx.font = fnt(fs); }   // long names shrink to fit the tag instead of clipping
  tagCtx.fillStyle = '#ffffff';
  tagCtx.textAlign = 'center';
  tagCtx.textBaseline = 'middle';
  tagCtx.fillText(label, 256, 64);
  
  tagTex.needsUpdate = true;
  tagSprite.visible = true;
}

function place(list){
  let px=0,py=0;
  list.forEach((e,k)=>{e.loc='held';e.mx=e.my=null;
    if(e.x!=null){px=e.x;py=e.y;e.loc='exact';e.mx=px;e.my=py}

        let dist=e.type==='goal'?8+h.a*17:e.type==='blocked-shot'?38+h.a*14:/slap/.test(d)?52+h.a*12:/backhand|tip-in|deflect/.test(d)?10+h.a*12:/wrap/.test(d)?5:28+h.a*17;

// ─── CAMERA VIEW CYCLER ───
let camViews = [
  { name: 'High Wide',      yaw: 0,          pitch: 0.85, dist: 196 },
  { name: 'Broadcast',      yaw: 0,          pitch: 0.45, dist: 210 },
  { name: 'End Zone',       yaw: Math.PI/2,  pitch: 0.35, dist: 180 },
  { name: 'Goalie Cam',     yaw: 0,          pitch: 0.25, dist: 160 },
  { name: 'Ceiling / Graph Top', yaw: Math.PI/2,  pitch: 1.85, dist: 280 } // <-- NEW VIEW
];
let camIdx = 0;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  const t=b.dataset.t;
  
  // Open the tab if it's not already open
  if (!b.classList.contains('on')) {
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id==='p-'+t));
    if(t==='vid') renderVidSoft();
    if(t==='hist') renderHist();
    if(t==='stand') renderStand();
    if(t==='cards') updateCards();
  }
  
  // Only cycle the camera if they explicitly click the Rink tab
  if (t === 'rink') {
    camIdx = (camIdx + 1) % camViews.length;
    const v = camViews[camIdx];
    yaw = v.yaw;
    pitch = v.pitch;
    dist = v.dist;
    
    // Show the camera name in the info bar
    info.innerHTML = `<b>📷 Camera: ${v.name}</b>`;
  }
});

/* ═════ MOMENTUM ALERT NOTIFICATIONS ═════ */
let lastAlertTime = { A: 0, H: 0 };
let lastAlertWp = { A: 50, H: 50 };

function checkMomentumAlert(e) {
  if (!ev.length || !wpFits() || !wpSeries) return;

  // Get the win prob at the current event time
  const r = wpAt(e.t);
  const a = r.a, h = 100 - r.a;
  
  // Calculate the jump compared to the last checked state
  const jumpA = a - lastAlertWp.A;
  const jumpH = h - lastAlertWp.H;
  
  // Update the baseline
  lastAlertWp.A = a;
  lastAlertWp.H = h;

  const now = Date.now();
  const g = games.find(x => x.id == gameSel) || {a: 'A', h: 'H'};

  // Trigger logic: +3% jump and 60s cooldown
  let alertSide = null;
  if (jumpA >= 3 && now - lastAlertTime.A > 60000) alertSide = 'A';
  else if (jumpH >= 3 && now - lastAlertTime.H > 60000) alertSide = 'H';

  if (alertSide) {
    lastAlertTime[alertSide] = now;
    showMomentumToast(alertSide, alertSide === 'A' ? jumpA : jumpH, g, e);
  }
}

function showMomentumToast(side, jump, g, currentEvent) {
  const box = document.getElementById('toastBox');
  const team = side === 'A' ? g.a : g.h;
  const color = side === 'A' ? '#1d4ed8' : '#0e7490';
  const oppColor = side === 'A' ? '#0e7490' : '#1d4ed8';
  
  // Create the toast element
  const toast = document.createElement('div');
  toast.className = 'momentum-alert';
  
  // Draw the mini graph on a canvas
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 120; // 2:1 aspect ratio for the mini graph
  const ctx = canvas.getContext('2d');

  // We render a mini version of the win-prob line up to this event
  const wpSlice = wpSeries.filter(x => x.t <= currentEvent.t);
  if (wpSlice.length > 0) {
    const maxT = Math.max(3600, wpSlice[wpSlice.length - 1].t);
    
    // Background
    ctx.fillStyle = '#02050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Home area (top)
    ctx.beginPath();
    ctx.moveTo(0, 60);
    wpSlice.forEach(x => {
      const px = (x.t / maxT) * canvas.width;
      const py = 60 - ((x.h / 100) * 50);
      ctx.lineTo(px, py);
    });
    ctx.lineTo(canvas.width, 60);
    ctx.fillStyle = g.h === team ? '#0e7490' : '#1d4ed8';
    ctx.globalAlpha = 0.4;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Away area (bottom)
    ctx.beginPath();
    ctx.moveTo(0, 60);
    wpSlice.forEach(x => {
      const px = (x.t / maxT) * canvas.width;
      const py = 60 + ((x.a / 100) * 50);
      ctx.lineTo(px, py);
    });
    ctx.lineTo(canvas.width, 60);
    ctx.fillStyle = g.h === team ? '#1d4ed8' : '#0e7490';
    ctx.globalAlpha = 0.4;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Line
    ctx.beginPath();
    wpSlice.forEach((x, i) => {
      const px = (x.t / maxT) * canvas.width;
      const py = 60 - ((x.h / 100) * 50); // draw home line
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = '#e0f2fe';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Highlight the current event point
    ctx.beginPath();
    const finalX = (currentEvent.t / maxT) * canvas.width;
    const finalY = 60 - ((wpAt(currentEvent.t).h / 100) * 50);
    ctx.arc(finalX, finalY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#facc15';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  toast.innerHTML = `
    <div class="ma-hd">
      <span>${team} Momentum</span>
      <span style="color:${color}">+${Math.round(jump)}%</span>
    </div>
  `;
  toast.appendChild(canvas);
  
  box.appendChild(toast);

  // Auto-remove after 6 seconds
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  }, 6000);
  
  // Click to jump to this event
  toast.onclick = () => {
    select(currentEvent.i);
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  };
}
</script>
